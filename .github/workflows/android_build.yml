name: Android Builder

on:
  push:
    branches: [ "Dev" ]
  pull_request:
    branches: [ "Dev" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Apps & Bundles
    runs-on: ubuntu-latest
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 23 (Required for TargetSdk 36 / Gradle 9.3+)
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'gradle' # Basic Java-level gradle caching

      # 3. Setup Gradle with Advanced Caching Options
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only download cache if it's a hit (saves bandwidth)
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Enables detailed Build Summary in GitHub Actions UI
          add-job-summary: 'on'
          # Advanced Caching settings
          cache-overwrite-existing: false # Speeds up by not overwriting valid caches
          generate-job-summary: true

      # 4. Grant execute permission for the Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Run Lint Analysis (Separated)
      - name: Run Lint Analysis
        run: ./gradlew lintDebug lintRelease --parallel --build-cache --stacktrace

      # 6. Run Unit Tests (Separated - Commented for missing libs)
      # - name: Run Unit Tests
      #   run: ./gradlew testDebugUnitTest --parallel --build-cache --stacktrace
      #   continue-on-error: true 

      # 7. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --build-cache --stacktrace

      # 8. Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --parallel --build-cache --stacktrace

      # 9. Build Release AAB
      - name: Build Release AAB
        run: ./gradlew bundleRelease --parallel --build-cache --stacktrace
        
      # 10. Generate Professional Build Summary (Restored Table & Messages)
      - name: Generate Build Summary
        if: always()
        run: |
          DEBUG_APK_SIZE=$(du -sh app/build/outputs/apk/debug/*.apk | cut -f1 || echo "N/A")
          RELEASE_APK_SIZE=$(du -sh app/build/outputs/apk/release/*.apk | cut -f1 || echo "N/A")
          RELEASE_AAB_SIZE=$(du -sh app/build/outputs/bundle/release/*.aab | cut -f1 || echo "N/A")
          
          echo "### 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Debug APK built successfully**" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Release APK built successfully**" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Bundle built successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📦 Artifact Details" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APK | $DEBUG_APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Release APK | $RELEASE_APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Bundle (AAB) | $RELEASE_AAB_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Gradle Root Project:** \`${{ github.event.repository.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Requested Tasks:** \`assembleDebug assembleRelease bundleRelease\`" >> $GITHUB_STEP_SUMMARY

      # 11. Upload Quality Reports
      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-*
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testReleaseUnitTest/

      # 12. Upload Debug APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # 13. Upload Release APK Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 14. Upload Release Bundle (AAB) Artifact
      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab