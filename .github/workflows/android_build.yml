name: Android Builder

on:
  push:
    branches: [ "Dev" ]
  pull_request:
    branches: [ "Dev" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Apps & Bundles
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 23 (Required for TargetSdk 36 / Gradle 8.10+)
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      # 3. Setup Gradle with Caching (Enables "Fast Build")
      # This action automatically handles saving/restoring the Gradle User Home
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only download cache if it's a hit (saves bandwidth)
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 4. Grant execute permission for the Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Build Release APK
      # Note: This will be unsigned unless signingConfig is set in build.gradle
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 7. Build Release Bundle (AAB)
      # Required for Play Store upload
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      # 8. Upload Debug APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 9. Upload Release APK Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      # 10. Upload Release Bundle (AAB) Artifact
      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
