name: Android Builder

on:
  push:
    branches: [ "Dev" ]
  pull_request:
    branches: [ "Dev" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Apps & Bundles
    runs-on: ubuntu-latest
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 23 (Required for TargetSdk 36 / Gradle 9.3+)
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Enables detailed Build Summary in GitHub Actions UI
          add-job-summary: 'on'

      # 4. Grant execute permission for the Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Run Lint Analysis & Unit Tests (Ensures Code Quality & Logic)
      - name: Run Quality Checks (Lint & Unit Tests)
        run: ./gradlew lintDebug testDebugUnitTest --parallel --build-cache --stacktrace

      # 6. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --build-cache --stacktrace

      # 7. Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --parallel --build-cache --stacktrace

      # 8. Build Release Bundle (AAB)
      - name: Build Release AAB
        run: ./gradlew bundleRelease --parallel --build-cache --stacktrace

      # 9. Upload Reports (Lint & Test Results)
      - name: Upload Quality Reports
        if: always() # Upload even if tests or lint fail
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-*
            app/build/test-results/testDebugUnitTest

      # 10. Upload Debug APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # 11. Upload Release APK Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 12. Upload Release Bundle (AAB) Artifact
      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab